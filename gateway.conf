#
# Sample configuration for gateway
#

debug 1
mode gateway
# Must match all nodes. Generate with: openssl rand -hex 16
network_id 4b7d9a1c8e2f6350a9c4d1e7b8f2036a
port /dev/ttyUSB4 1200
#serial_packet_loss 0.5
retry_timeout 2
backoff_time_max 10

node node01 password123
